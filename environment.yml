# conda env create -f environment.yml && conda activate rfqco
# then, once: conda env config vars set GEMINI_KEY=<your key>   (never commit it)
name: rfqco
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e ".[dev]"  # runtime deps live in pyproject.toml
variables:
  LLM_PROVIDER: gemini
  LLM_MODEL: gemini-3.5-flash-lite
